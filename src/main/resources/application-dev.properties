# Shared development environment profile.
# Supply all values through environment variables / deployment configuration.
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.services.employee-base-url=${EMPLOYEE_SERVICE_URL}
app.services.department-base-url=${DEPARTMENT_SERVICE_URL}

logging.level.root=INFO
logging.level.com.company=INFO
# Department service communication (development)
app.services.department-connect-timeout-ms=${DEPARTMENT_CONNECT_TIMEOUT_MS:2000}
app.services.department-read-timeout-ms=${DEPARTMENT_READ_TIMEOUT_MS:3000}
