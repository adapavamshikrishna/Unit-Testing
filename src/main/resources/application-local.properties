# Local development profile
server.port=${LOCAL_SERVER_PORT:8080}

spring.datasource.url=${LOCAL_DB_URL:jdbc:mysql://localhost:3306/employee_department_db}
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local service URLs (override through environment variables when needed)
app.services.employee-base-url=${EMPLOYEE_SERVICE_URL:http://localhost:8080/api/employees}
app.services.department-base-url=${DEPARTMENT_SERVICE_URL:http://localhost:8080/api/departments}

logging.level.com.company=DEBUG
# Department service communication (local)
app.services.department-connect-timeout-ms=2000
app.services.department-read-timeout-ms=3000
